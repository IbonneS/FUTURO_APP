<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FUTURO | Tu vida, tu elección</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--fg:#fff;
--pink:#ff2e9a;--purple:#7c3aff;--blue:#2e7dff;--cyan:#00e0ff;--orange:#ff8a1e;--lime:#c6ff3d;--green:#12e28a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Inter',sans-serif;color:var(--fg);position:relative;overflow-x:hidden;
background:#070315;
padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
min-height:100%;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;z-index:-2;
background:
radial-gradient(circle at 12% 8%,rgba(255,46,154,.30),transparent 32%),
radial-gradient(circle at 88% 15%,rgba(0,224,255,.22),transparent 30%),
radial-gradient(circle at 25% 90%,rgba(124,58,255,.30),transparent 35%),
radial-gradient(circle at 90% 85%,rgba(255,138,30,.20),transparent 30%),
linear-gradient(160deg,#0a0420 0%,#150a30 45%,#06031a 100%);
background-size:180% 180%;animation:drift 18s ease-in-out infinite}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
background:linear-gradient(to bottom,rgba(255,255,255,.025),transparent 22%,rgba(0,0,0,.16));
}
@keyframes drift{0%,100%{background-position:0% 0%}50%{background-position:100% 60%}}
.wrap{width:min(820px,100%);margin:0 auto;padding:30px 22px 125px;position:relative;z-index:1}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}

.btn{width:100%;border:none;border-radius:16px;padding:15px 20px;min-height:50px;font-weight:800;font-size:15px;
background:linear-gradient(135deg,var(--pink),var(--purple) 55%,var(--blue));color:#fff;transition:.2s;
box-shadow:0 6px 22px rgba(180,40,220,.35)}
.btn:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 10px 30px rgba(255,46,154,.45)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-outline{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18);box-shadow:none}
.row{display:flex;gap:12px}
.row>*{flex:1}
.logo{font-size:34px;font-weight:900;letter-spacing:-1px;
background:linear-gradient(90deg,#fff,#d9c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:#b7a6e0;font-size:13px;font-weight:600}
.page-title{font-size:32px;font-weight:900;letter-spacing:-1.5px;margin:20px 0 4px}
.page-subtitle{color:#b6a9d9;font-size:15px;margin-bottom:22px}
.card{background:linear-gradient(160deg,rgba(35,20,60,.75),rgba(15,10,30,.85));
border:1px solid rgba(255,255,255,.10);border-radius:22px;
padding:22px;margin-bottom:16px;box-shadow:0 12px 35px rgba(0,0,0,.35);
backdrop-filter:blur(6px);transition:.2s}
.card:hover{border-color:rgba(255,255,255,.22);transform:translateY(-2px)}
.card:active{transform:translateY(0)}
.card-blue{background:radial-gradient(circle at top right,rgba(0,224,255,.28),transparent 50%),linear-gradient(160deg,rgba(20,30,70,.85),rgba(10,12,35,.9))}
.card-orange{background:radial-gradient(circle at top right,rgba(255,138,30,.28),transparent 50%),linear-gradient(160deg,rgba(60,30,15,.85),rgba(25,12,10,.9))}
.card-purple{background:radial-gradient(circle at top right,rgba(255,46,154,.26),transparent 50%),linear-gradient(160deg,rgba(50,15,60,.85),rgba(20,8,30,.9))}
.metric{font-size:27px;font-weight:900;
background:linear-gradient(90deg,#fff,#e6d8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.metric-label{color:#b6a9d9;font-size:12px;font-weight:700;letter-spacing:.5px}
.big-number{font-size:44px;font-weight:900;
background:linear-gradient(90deg,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
.small-muted{color:#a99cc9;font-size:13px}
.hero{border-radius:28px;padding:34px 26px;margin-bottom:20px;border:1px solid rgba(255,255,255,.14);position:relative;overflow:hidden;
background:radial-gradient(circle at 85% 10%,rgba(0,224,255,.30),transparent 40%),
radial-gradient(circle at 10% 100%,rgba(255,46,154,.25),transparent 40%),
linear-gradient(135deg,#1a0c3d,#0a0620);box-shadow:0 15px 45px rgba(90,20,140,.25)}
.hero-kicker{color:var(--cyan);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:2.5px}
.hero-title{font-size:39px;line-height:1.08;font-weight:900;margin:10px 0}
.hero-title span{background:linear-gradient(90deg,var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-text{color:#c3b6e6;font-size:15px;line-height:1.65}
.avatar{width:112px;height:112px;border-radius:50%;background:linear-gradient(145deg,var(--pink),var(--purple) 60%,var(--blue));
display:flex;align-items:center;justify-content:center;font-size:58px;margin:0 auto 10px;
border:3px solid rgba(255,255,255,.35);box-shadow:0 0 50px rgba(255,46,154,.35)}
.progress-container{background:rgba(255,255,255,.08);height:11px;border-radius:20px;overflow:hidden;margin:12px 0}
.progress-bar{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--pink),var(--cyan))}
.story{min-height:440px;border-radius:26px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;
border:1px solid rgba(255,255,255,.12);
background:radial-gradient(circle at 80% 15%,rgba(255,138,30,.35),transparent 35%),linear-gradient(150deg,#2a1050,#0c0620)}
.story-label{color:var(--orange);font-size:12px;font-weight:900;letter-spacing:2px}
.story-question{font-size:29px;font-weight:900;line-height:1.2;margin-top:14px}
.badge{display:inline-block;background:rgba(0,224,255,.15);color:#7be9ff;padding:6px 12px;border-radius:50px;
font-size:12px;font-weight:800;margin:3px 4px 3px 0;border:1px solid rgba(0,224,255,.25)}
.badge-orange{background:rgba(255,138,30,.15);color:#ffb266;border-color:rgba(255,138,30,.3)}
.chat-user{background:linear-gradient(135deg,var(--purple),var(--blue));border-radius:18px 18px 4px 18px;padding:13px 16px;margin:10px 0 10px 18%;font-weight:600}
.chat-ai{background:rgba(255,255,255,.06);border-radius:18px 18px 18px 4px;padding:13px 16px;margin:10px 18% 10px 0;
border:1px solid rgba(255,255,255,.1)}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.15);
background:rgba(20,10,40,.6);color:#fff;font-size:14px;margin:6px 0 14px}
.field:focus{outline:none;border-color:var(--pink)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:linear-gradient(135deg,var(--green),#0aa869);color:#03130a;
padding:12px 22px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:0 10px 30px rgba(20,220,140,.4);
opacity:0;pointer-events:none;transition:.3s;z-index:50;text-align:center;max-width:90%}
.toast.show{opacity:1;bottom:100px}
.alert{border-radius:14px;padding:13px 16px;font-size:13px;margin:14px 0;border:1px solid}
.alert-warn{background:rgba(255,180,30,.12);color:#ffd27a;border-color:rgba(255,180,30,.3)}
.alert-info{background:rgba(0,224,255,.10);color:#8ee9ff;border-color:rgba(0,224,255,.3)}
.alert-ok{background:rgba(18,226,138,.12);color:#7cf0bb;border-color:rgba(18,226,138,.3)}
/* ===== NAVEGACIÓN APP ===== */
.nav{
  position:fixed;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  width:min(1120px,calc(100% - 28px));
  padding:10px;
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:8px;
  background:rgba(8,4,22,.94);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.13);
  border-radius:24px;
  box-shadow:0 18px 50px rgba(0,0,0,.48),0 0 35px rgba(124,58,255,.12);
  z-index:40;
}
.nav button{
  min-height:72px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.075);
  color:#9d91bb;
  border-radius:17px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:8px 4px;
  font-size:27px;
  transition:transform .18s ease,background .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease;
}
.nav button:hover{
  transform:translateY(-3px);
  color:#fff;
  background:rgba(255,255,255,.09);
  border-color:rgba(255,255,255,.18);
}
.nav button:active{transform:scale(.96)}
.nav button.active{
  color:#fff;
  background:linear-gradient(135deg,rgba(255,46,154,.34),rgba(124,58,255,.34),rgba(0,224,255,.20));
  border-color:rgba(255,255,255,.24);
  box-shadow:0 7px 22px rgba(124,58,255,.24),inset 0 0 22px rgba(255,255,255,.035);
}
.nav span{font-size:11px;font-weight:800;line-height:1}
select.field{appearance:none}
h2,h3{margin:10px 0 6px}

/* ===== PRESENTACIÓN EN PC ===== */
@media(min-width:901px){
  .wrap{padding-top:38px}
  .hero{padding:40px 30px}
  .card{padding:24px}
  .page-title{font-size:34px}
}

/* ===== TABLET ===== */
@media(max-width:900px){
  .nav{
    width:calc(100% - 20px);
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:7px;
    bottom:10px;
    border-radius:21px;
  }
  .nav button{min-height:66px}
  .nav span{font-size:10px}
}

/* ===== CELULAR ===== */
@media(max-width:600px){
  .wrap{
    width:100%;
    padding:22px 14px 170px;
  }
  .hero{
    padding:28px 20px;
    border-radius:23px;
  }
  .hero-title{font-size:30px}
  .page-title{font-size:27px}
  .card{padding:19px;border-radius:19px}
  .row{flex-wrap:wrap}
  .row>*{min-width:0}
  .nav{
    width:calc(100% - 12px);
    bottom:6px;
    padding:7px;
    gap:6px;
    border-radius:19px;
  }
  .nav button{
    min-height:60px;
    border-radius:14px;
    font-size:23px;
    padding:6px 2px;
  }
  .nav span{font-size:9px}
}

/* ===== CELULAR PEQUEÑO ===== */
@media(max-width:360px){
  .wrap{padding-left:11px;padding-right:11px}
  .nav button{
    min-height:56px;
    font-size:20px;
  }
  .nav span{font-size:8px}
}

/* =========================================================
   FUTURO APP UI — V2
   Visual layer only: mantiene la lógica y JavaScript existentes.
   ========================================================= */

:root{
  --app-bg:#070315;
  --glass:rgba(20,12,42,.72);
  --glass-strong:rgba(15,8,32,.90);
  --line:rgba(255,255,255,.11);
  --line-soft:rgba(255,255,255,.07);
  --muted:#a99dcc;
  --shadow:0 18px 55px rgba(0,0,0,.34);
}

/* Contenedor de aplicación en escritorio */
@media(min-width:901px){
  body{
    background:#03020b;
  }

  body::before{
    opacity:.78;
  }

  #app{
    width:min(820px,calc(100vw - 40px));
    margin:18px auto 0;
    min-height:calc(100vh - 160px);
    border:1px solid rgba(255,255,255,.07);
    border-radius:32px;
    background:linear-gradient(180deg,rgba(16,8,35,.30),rgba(7,3,20,.16));
    box-shadow:0 30px 90px rgba(0,0,0,.30);
    overflow:hidden;
  }
}

/* Barra superior más limpia */
.logo{
  font-size:32px;
  letter-spacing:-1.5px;
  text-shadow:0 0 30px rgba(255,46,154,.18);
}

.tagline{
  margin-top:2px;
  letter-spacing:.2px;
}

/* Hero: más profundidad y jerarquía */
.hero{
  position:relative;
  isolation:isolate;
  overflow:hidden;
}

.hero::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-70px;
  bottom:-85px;
  border-radius:50%;
  background:rgba(124,58,255,.22);
  filter:blur(20px);
  z-index:-1;
}

.hero-kicker{
  display:inline-flex;
  align-items:center;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(0,224,255,.08);
  border:1px solid rgba(0,224,255,.16);
}

.hero-text{
  max-width:620px;
}

/* Tarjetas */
.card{
  box-shadow:var(--shadow);
}

.card + .card{
  margin-top:0;
}

.metric{
  font-size:29px;
}

.metric-label{
  margin-top:4px;
}

/* Botones principales */
.btn{
  min-height:52px;
  letter-spacing:.15px;
}

.btn-outline{
  background:rgba(255,255,255,.045);
}

.btn-outline:hover{
  background:rgba(255,255,255,.09);
  border-color:rgba(255,255,255,.25);
}

/* Inputs más app-like */
.field{
  min-height:48px;
  border-radius:14px;
  background:rgba(8,4,22,.62);
}

.field::placeholder{
  color:#74688e;
}

/* Badges */
.badge{
  padding:7px 11px;
  box-shadow:inset 0 0 16px rgba(0,224,255,.035);
}

/* Progreso */
.progress-container{
  height:10px;
  background:rgba(255,255,255,.065);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.25);
}

.progress-bar{
  box-shadow:0 0 16px rgba(0,224,255,.28);
}

/* Story */
.story{
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.story::after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  right:-55px;
  top:-55px;
  border-radius:50%;
  background:rgba(255,138,30,.18);
  filter:blur(10px);
  pointer-events:none;
}

/* Navegación: dock de app */
.nav{
  position:fixed;
  left:50%;
  bottom:max(10px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(760px,calc(100% - 20px));
  padding:8px;
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:7px;
  background:rgba(7,3,20,.90);
  border:1px solid rgba(255,255,255,.13);
  border-radius:22px;
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:
    0 18px 55px rgba(0,0,0,.52),
    0 0 40px rgba(124,58,255,.10);
  z-index:40;
}

.nav button{
  position:relative;
  min-width:0;
  min-height:64px;
  padding:7px 3px;
  border-radius:15px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.065);
  color:#9185ad;
  font-size:24px;
  overflow:hidden;
}

.nav button::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.06),transparent 60%);
  opacity:0;
  transition:.2s;
}

.nav button:hover::before,
.nav button.active::before{
  opacity:1;
}

.nav button:hover{
  color:#fff;
  transform:translateY(-2px);
  border-color:rgba(255,255,255,.18);
  background:rgba(255,255,255,.075);
}

.nav button.active{
  color:#fff;
  background:linear-gradient(135deg,
    rgba(255,46,154,.28),
    rgba(124,58,255,.28),
    rgba(0,224,255,.16)
  );
  border-color:rgba(255,255,255,.22);
  box-shadow:
    0 6px 18px rgba(124,58,255,.18),
    inset 0 0 18px rgba(255,255,255,.035);
}

.nav span{
  position:relative;
  z-index:1;
  font-size:9px;
  font-weight:800;
}

/* Tablet */
@media(max-width:900px){
  .nav{
    width:calc(100% - 16px);
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:6px;
    bottom:max(6px,env(safe-area-inset-bottom));
  }

  .nav button{
    min-height:61px;
    font-size:23px;
  }

  .nav span{
    font-size:9px;
  }
}

/* Celular */
@media(max-width:600px){
  body{
    background:#070315;
  }

  .wrap{
    padding:20px 13px calc(158px + env(safe-area-inset-bottom));
  }

  #app{
    width:100%;
  }

  .logo{
    font-size:29px;
  }

  .hero{
    margin-bottom:15px;
    padding:25px 19px;
    border-radius:23px;
  }

  .hero-kicker{
    font-size:10px;
    letter-spacing:1.7px;
  }

  .hero-title{
    font-size:29px;
    letter-spacing:-1px;
  }

  .hero-text{
    font-size:14px;
    line-height:1.6;
  }

  .page-title{
    font-size:26px;
    letter-spacing:-.8px;
  }

  .page-subtitle{
    font-size:14px;
    line-height:1.5;
  }

  .card{
    padding:18px;
    border-radius:19px;
    margin-bottom:12px;
  }

  .row{
    gap:9px;
  }

  .row>*{
    flex:1 1 100%;
  }

  /* En filas de métricas dejamos 3 tarjetas pequeñas */
  .row:has(.metric)>*{
    flex:1 1 0;
    min-width:0;
  }

  .metric{
    font-size:23px;
  }

  .metric-label{
    font-size:10px;
  }

  .btn{
    min-height:50px;
    border-radius:14px;
  }

  .nav{
    width:calc(100% - 12px);
    padding:6px;
    gap:5px;
    border-radius:19px;
  }

  .nav button{
    min-height:58px;
    border-radius:13px;
    font-size:21px;
  }

  .nav span{
    font-size:8px;
  }
}

/* Celulares muy pequeños */
@media(max-width:360px){
  .wrap{
    padding-left:10px;
    padding-right:10px;
  }

  .nav{
    width:calc(100% - 8px);
  }

  .nav button{
    min-height:54px;
    font-size:19px;
  }

  .nav span{
    font-size:7.5px;
  }
}

/* Evita que los elementos interactivos se vean diminutos */
@media(max-width:600px){
  input,select,button{
    touch-action:manipulation;
  }
}


/* ===== SIMULADOR V3 ===== */
.sim-hero{
  position:relative;
  overflow:hidden;
  padding:22px;
  border-radius:24px;
  background:
    radial-gradient(circle at 88% 12%,rgba(0,224,255,.18),transparent 34%),
    radial-gradient(circle at 12% 90%,rgba(124,58,255,.20),transparent 38%),
    linear-gradient(145deg,rgba(29,14,60,.88),rgba(9,5,25,.82));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 50px rgba(0,0,0,.30);
}
.sim-hero .sim-icon{
  width:52px;height:52px;
  display:grid;place-items:center;
  border-radius:16px;
  background:rgba(0,224,255,.10);
  border:1px solid rgba(0,224,255,.18);
  font-size:27px;
  margin-bottom:14px;
}
.sim-kicker{
  color:#78eaff;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.8px;
}
.sim-title{
  margin-top:5px;
  font-size:29px;
  line-height:1.08;
  font-weight:950;
  letter-spacing:-1px;
}
.sim-title span{
  background:linear-gradient(90deg,#fff,#7eefff,#b894ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.sim-sub{
  margin-top:9px;
  color:#aaa0c4;
  font-size:13px;
  line-height:1.55;
}
.sim-input-card{
  margin-top:14px;
  padding:18px;
  border-radius:20px;
  background:rgba(13,7,30,.78);
  border:1px solid rgba(255,255,255,.09);
}
.sim-label-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:9px;
}
.sim-label{
  font-size:12px;
  font-weight:850;
  color:#c9c0dc;
}
.sim-value{
  color:#fff;
  font-size:20px;
  font-weight:950;
}
.sim-range{
  width:100%;
  accent-color:#7c3aff;
  cursor:pointer;
}
.sim-presets{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:11px;
}
.sim-preset{
  min-height:40px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.045);
  color:#bdb2d2;
  font-weight:800;
  font-size:11px;
}
.sim-preset:hover,.sim-preset.active{
  color:#fff;
  border-color:rgba(124,58,255,.55);
  background:rgba(124,58,255,.16);
}
.sim-total{
  margin-top:14px;
  padding:21px;
  border-radius:23px;
  background:
    linear-gradient(135deg,rgba(0,224,255,.13),rgba(124,58,255,.18)),
    rgba(13,7,30,.82);
  border:1px solid rgba(120,235,255,.17);
  box-shadow:0 18px 50px rgba(0,0,0,.25);
}
.sim-total-label{
  color:#8eeaff;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
}
.sim-total-number{
  margin-top:5px;
  font-size:42px;
  line-height:1;
  font-weight:950;
  letter-spacing:-1.5px;
}
.sim-total-copy{
  margin-top:8px;
  color:#aaa0c4;
  font-size:12px;
}
.sim-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}
.sim-stat{
  padding:13px 9px;
  border-radius:16px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.065);
}
.sim-stat strong{
  display:block;
  font-size:16px;
  color:#fff;
}
.sim-stat span{
  display:block;
  margin-top:3px;
  color:#8f84a9;
  font-size:9px;
  line-height:1.25;
}
.sim-chart-card{
  margin-top:12px;
  padding:17px;
  border-radius:20px;
  background:rgba(13,7,30,.72);
  border:1px solid rgba(255,255,255,.08);
}
.sim-section-title{
  font-size:13px;
  font-weight:900;
  color:#eee8f7;
}
.sim-section-sub{
  margin-top:3px;
  color:#817696;
  font-size:10px;
}
.sim-chart-wrap{
  margin-top:9px;
  margin-left:-7px;
  margin-right:-7px;
}
.sim-insight{
  margin-top:12px;
  padding:15px;
  border-radius:17px;
  background:rgba(255,138,30,.075);
  border:1px solid rgba(255,138,30,.18);
}
.sim-insight strong{
  color:#ffc078;
}
.sim-note{
  margin-top:12px;
  font-size:10px;
  line-height:1.5;
  color:#817696;
}
@media(max-width:600px){
  .sim-hero{padding:19px;border-radius:21px}
  .sim-title{font-size:27px}
  .sim-input-card{padding:16px}
  .sim-presets{grid-template-columns:repeat(4,1fr)}
  .sim-total{padding:19px}
  .sim-total-number{font-size:38px}
  .sim-stats{gap:6px}
  .sim-stat{padding:12px 7px}
  .sim-stat strong{font-size:15px}
}
@media(max-width:360px){
  .sim-presets{grid-template-columns:repeat(2,1fr)}
}

</style>
</head>
<body>
<main id="app" class="wrap" aria-label="Aplicación FUTURO"></main>
<div id="toast" class="toast"></div>

<script>
const S = {
  pantalla:"onboarding", edad:21, ahorro_semana:10, ahorro_total:0,
  xp:120, racha:12, nivel:7, meta:38,
  stories_completadas:0, misiones_completadas:0, logros:4
};
const misionesData = [
  ["🔥","El reto S/5","Encuentra S/5 que normalmente gastarías y guárdalos.",100,5],
  ["💳","Compra consciente","Antes de comprar algo, espera 10 minutos.",75,0],
  ["🎯","Primera meta","Define para qué quieres tener dinero en el futuro.",100,0],
  ["🌅","Piensa en 2040","Imagina una experiencia que quieres poder elegir mañana.",150,0]
];
const navOpts = [["🏠","Inicio","inicio"],["📖","Stories","stories"],["🎯","Misiones","misiones"],
["🤖","AI","ai"],["🌅","Vida","vida"],["📊","Simular","simulador"],["👥","Círculo","circulo"],["👤","Perfil","perfil"]];

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}
function ir(p){ S.pantalla=p; render(); window.scrollTo(0,0); }
function completarAccion(xp=100, ahorro=0){
  S.xp+=xp; S.ahorro_total+=ahorro; S.racha+=1;
  if(S.xp>=500){ S.nivel+=1; S.xp-=500; }
}
function header(){
  return `<div class="row" style="align-items:flex-start">
    <div><div class="logo">FU<span>TU</span>RO</div><div class="tagline">Tu vida, tu elección</div></div>
    <div style="text-align:right;font-weight:800;color:#ff9d42;font-size:15px">🔥 ${S.racha} días</div>
  </div><br>`;
}
function nav(){
  return `<div class="nav">${navOpts.map(([ic,name,dest])=>
    `<button class="${S.pantalla===dest?'active':''}" onclick="ir('${dest}')"><span style="font-size:19px">${ic}</span><span>${name}</span></button>`
  ).join('')}</div>`;
}

function screenOnboarding(){
  return `<br><br>
  <div style="text-align:center">
    <div style="font-size:60px;margin-bottom:8px">🚀</div>
    <div class="logo" style="font-size:42px">FU<span>TU</span>RO</div>
    <div style="color:#9bb0cc;font-size:15px;margin-top:4px">Tu vida, tu elección</div>
  </div><br>
  <div class="hero">
    <div class="hero-kicker">UNA DECISIÓN PUEDE CAMBIAR TU RUMBO</div>
    <div class="hero-title">Tienes <span>21 años.</span><br>Tu futuro acaba de comenzar.</div>
    <div class="hero-text">No necesitas saber exactamente cómo será tu vida. Solo necesitas empezar a construir las opciones que quieres tener mañana.</div>
  </div>
  <div class="card" style="text-align:center">
    <div style="font-size:42px">👤</div>
    <h2>¿Quieres conocer a tu YO del FUTURO?</h2>
    <p class="small-muted">Descubre qué puedes empezar a construir desde hoy.</p>
    <button class="btn" onclick="ir('ahorro')">✨ CONOCERLO →</button>
  </div>`;
}
function screenAhorro(){
  return header()+`
  <div class="page-title">Pero antes...</div>
  <div class="page-subtitle">¿Cuánto puedes guardar esta semana?</div>
  <div class="row">${[5,10,20].map(c=>`<button class="btn" onclick="elegirAhorro(${c})">S/ ${c}</button>`).join('')}</div>
  <br>
  <label class="small-muted">O escribe otro monto</label>
  <input id="otroMonto" class="field" type="number" min="1" value="10" step="5">
  <button class="btn" onclick="elegirAhorro(document.getElementById('otroMonto').value*1)">EMPEZAR CON ESTE MONTO →</button>`;
}
function elegirAhorro(c){ S.ahorro_semana=c; S.ahorro_total+=c; S.xp+=100; S.meta+=5; ir('inicio'); }

function screenInicio(){
  const progreso = Math.min(S.meta,100);
  return header()+`
  <div class="hero">
    <div class="hero-kicker">TU YO DEL FUTURO</div>
    <div class="hero-title">Tu futuro acaba de <span>comenzar.</span></div>
    <div class="hero-text">Cada pequeña decisión que tomas hoy puede darte más opciones mañana.</div>
  </div>
  <div class="row">
    <div class="card"><div class="metric">🔥 ${S.racha}</div><div class="metric-label">DÍAS DE RACHA</div></div>
    <div class="card"><div class="metric">⭐ ${S.nivel}</div><div class="metric-label">NIVEL</div></div>
    <div class="card"><div class="metric">💰 S/${S.ahorro_total}</div><div class="metric-label">AHORRO ACUMULADO</div></div>
  </div>
  <div class="row" style="align-items:stretch">
    <div class="card" style="text-align:center;flex:1">
      <div class="avatar">🧑‍🚀</div><h3>Constructor de libertad</h3><span class="badge">NIVEL ${S.nivel}</span>
    </div>
    <div class="card card-blue" style="flex:2">
      <div style="font-size:13px;color:#75aaff;font-weight:800">TU META</div>
      <div style="font-size:23px;font-weight:900;margin-top:6px">Construir opciones para mi futuro</div>
      <div class="progress-container"><div class="progress-bar" style="width:${progreso}%"></div></div>
      <div class="row"><span class="small-muted">Progreso</span><strong style="text-align:right">${progreso}%</strong></div>
    </div>
  </div>
  <div class="page-title" style="font-size:22px">🎯 Misión de hoy</div>
  <div class="card card-orange">
    <div style="color:#ffad62;font-size:12px;font-weight:900;letter-spacing:1px">RETO S/5</div>
    <h2>Encuentra S/5 que normalmente gastarías.</h2>
    <p class="small-muted">No se trata de dejar de vivir hoy. Se trata de demostrarte que puedes elegir.</p>
  </div>
  <button class="btn" onclick="misionInicio()">🔥 HACER MISIÓN</button><br><br>
  <button class="btn btn-outline" onclick="ir('stories')">📖 VER MI STORY DE HOY</button>`;
}
function misionInicio(){
  completarAccion(100,5); S.misiones_completadas+=1; S.logros+=1;
  toast("¡Misión completada! +100 XP · S/5 guardados · 🔥 Racha aumentada"); render();
}

function screenStories(){
  return header()+`
  <div class="page-title">📖 STORIES</div>
  <div class="page-subtitle">Tus decisiones de hoy también cuentan.</div>
  <div class="story">
    <div>
      <div class="story-label">HOY · 10:42 AM</div><br>
      <div style="font-size:50px">💸</div>
      <div class="story-question">Te sobraron S/10.</div>
      <p class="small-muted" style="font-size:15px">Podrías gastarlos ahora. O podrías convertirlos en una decisión para tu futuro.</p>
    </div>
    <div><strong>¿Qué elegiría tu YO DEL FUTURO?</strong></div>
  </div><br>
  <div class="row">
    <button class="btn btn-outline" onclick="toast('Hoy los gastaste. No pasa nada. FUTURO no busca castigarte: busca ayudarte a decidir.')">🛍️ GASTAR LOS S/10</button>
    <button class="btn" onclick="guardarStory()">🔥 GUARDAR S/10</button>
  </div><br>
  <div class="card"><span class="badge">💡 APRENDIZAJE</span>
  <p>Ahorrar no siempre requiere grandes cantidades. La primera meta es construir el hábito de decidir.</p></div>`;
}
function guardarStory(){
  completarAccion(100,10); S.stories_completadas+=1; S.logros+=1;
  toast("¡Elegiste guardar! +100 FUTURO XP · +S/10 · 🔥 Racha mantenida"); render();
}

function screenMisiones(){
  return header()+`
  <div class="page-title">🎯 MISIÓN DE HOY</div>
  <div class="page-subtitle">No son tareas. Son pequeñas decisiones que construyen hábitos.</div>
  ${misionesData.map(([ic,tit,desc,xp,ah],i)=>`
  <div class="card">
    <div style="font-size:32px">${ic}</div><h3>${tit}</h3>
    <p class="small-muted">${desc}</p>
    <span class="badge">+${xp} XP</span>${ah?`<span class="badge badge-orange">+S/${ah}</span>`:""}
  </div>
  <button class="btn" onclick="completarMision(${i})">COMPLETAR MISIÓN · ${tit}</button><br><br>`).join('')}`;
}
function completarMision(i){
  const [,tit,,xp,ah]=misionesData[i];
  completarAccion(xp,ah); S.misiones_completadas+=1;
  toast(`¡Misión completada! +${xp} XP`); render();
}

function screenAI(){
  return header()+`
  <div class="page-title">🤖 FUTURO AI</div>
  <div class="page-subtitle">Tu compañero para pensar tus decisiones financieras.</div>
  <div class="card card-purple"><div style="font-size:38px">🤖</div><h2>Hola. Soy FUTURO.</h2>
  <p>No estoy aquí para decirte qué hacer. Estoy aquí para ayudarte a ver tus opciones.</p></div>
  <div class="chat-user">Quiero salir con mis amigos pero también quiero ahorrar.</div>
  <div class="chat-ai">Perfecto. No tienes que elegir entre vivir hoy y pensar en mañana. 🎉<br><br>Podemos buscar un equilibrio.<br><br><strong>Plan de hoy:</strong> S/35 para salir · S/10 para tu futuro.</div>
  <div class="chat-user">Me quiero comprar unas zapatillas de S/300.</div>
  <div class="chat-ai">¿Quieres ver qué pasa si las compras hoy o si esperas 30 días?<br><br>Puedo ayudarte a comparar escenarios.</div>
  <br><div id="aiExtra"></div>
  <input id="aiInput" class="field" placeholder="Ej.: Quiero ahorrar S/100 este mes...">
  <button class="btn" onclick="preguntarAI()">Enviar</button>
  <div class="alert alert-info">Demo de IA: en esta versión las respuestas son simuladas. La integración con un modelo de IA puede añadirse posteriormente.</div>`;
}
function preguntarAI(){
  const v=document.getElementById('aiInput').value.trim();
  if(!v) return;
  document.getElementById('aiExtra').innerHTML+=`
  <div class="chat-user">${v.replace(/</g,'&lt;')}</div>
  <div class="chat-ai">💡 Pensemos juntos en tus opciones.<br><br>Si quieres ahorrar S/${S.ahorro_semana} por semana, primero podemos revisar cuánto representa al mes y qué pequeñas decisiones podrían ayudarte.</div>`;
  document.getElementById('aiInput').value='';
}

function screenVida(){
  const s = S._semanas||52;
  const total = S.ahorro_semana*s;
  return header()+`
  <div class="page-title">🌅 VIDA PARALELA</div>
  <div class="page-subtitle">No podemos conocer exactamente tu futuro. Pero podemos explorar tus decisiones.</div>
  <label class="small-muted">¿Cuántas semanas quieres imaginar? (${s})</label>
  <input type="range" min="4" max="104" value="${s}" style="width:100%" oninput="S._semanas=this.value*1; render()">
  <div class="row" style="align-items:stretch">
    <div class="card card-orange"><div style="font-size:36px">🛍️</div><h2>YO DE HOY</h2>
      <p class="small-muted">Gasto adicional de S/${S.ahorro_semana} cada semana.</p>
      <div class="big-number">S/0</div><p class="small-muted">El dinero se va en pequeñas decisiones.</p></div>
    <div class="card card-blue"><div style="font-size:36px">🚀</div><h2>YO QUE EMPIEZA A AHORRAR</h2>
      <p class="small-muted">Guarda S/${S.ahorro_semana} cada semana.</p>
      <div class="big-number">S/${total.toLocaleString('es-PE')}</div><p class="small-muted">Dinero acumulado en ${s} semanas.</p></div>
  </div>
  <div class="card"><h3>🌱 ¿Qué cambió?</h3>
  <p>No necesariamente tu salario. No necesariamente tu edad. No necesariamente tu vida.</p>
  <p><strong>Cambió una decisión repetida.</strong></p></div>
  <div class="alert alert-warn">Estos escenarios son ilustrativos. No representan una promesa de rentabilidad ni predicen cómo será tu situación futura.</div>`;
}

function drawChart(aporte,semanas){
  const w=680,h=220,pad=30;
  const total=aporte*semanas;
  const pts=[]; const N=Math.min(semanas,60);
  for(let i=0;i<=N;i++){ const s=Math.round(i*semanas/N);
    const x=pad+(w-2*pad)*(s/semanas); const y=h-pad-(h-2*pad)*(s*aporte/total||0);
    pts.push(`${x},${y}`);
  }
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:220px">
  <polyline points="${pts.join(' ')} ${w-pad},${h-pad} ${pad},${h-pad}" fill="rgba(23,119,255,.25)" stroke="none"/>
  <polyline points="${pts.join(' ')}" fill="none" stroke="#5ca8ff" stroke-width="3"/>
  </svg>`;
}
function screenSimulador(){
  const aporte = Math.max(1, S._aporte||S.ahorro_semana||10);
  const semanas = Math.max(1, S._sim_semanas||52);
  const total = aporte*semanas;
  const mensual = aporte*4;
  const anual = aporte*52;
  const meses = Math.max(1, Math.round(semanas/4.33));

  return header()+`
  <section class="sim-hero">
    <div class="sim-icon">📊</div>
    <div class="sim-kicker">EXPLORA TU FUTURO</div>
    <div class="sim-title">¿Qué pasa si <span>empiezas hoy?</span></div>
    <div class="sim-sub">
      Juega con el monto y el tiempo. Mira cómo tus pequeñas decisiones se acumulan.
    </div>
  </section>

  <div class="sim-input-card">
    <div class="sim-label-row">
      <label class="sim-label" for="simAporte">💰 ¿Cuánto guardarías cada semana?</label>
      <div class="sim-value">S/${aporte}</div>
    </div>
    <input id="simAporte" class="sim-range" type="range" min="1" max="200" step="1"
      value="${aporte}"
      oninput="S._aporte=this.value*1;render()">
    <div class="sim-presets">
      ${[5,10,20,50].map(v=>`
        <button class="sim-preset ${aporte===v?'active':''}"
          onclick="S._aporte=${v};render()">S/${v}</button>`).join('')}
    </div>
  </div>

  <div class="sim-input-card">
    <div class="sim-label-row">
      <label class="sim-label" for="simSemanas">🗓️ ¿Durante cuánto tiempo?</label>
      <div class="sim-value">${semanas} sem.</div>
    </div>
    <input id="simSemanas" class="sim-range" type="range" min="4" max="104" step="4"
      value="${semanas}"
      oninput="S._sim_semanas=this.value*1;render()">
    <div class="sim-presets">
      ${[[12,"3 meses"],[26,"6 meses"],[52,"1 año"],[104,"2 años"]].map(([v,l])=>`
        <button class="sim-preset ${semanas===v?'active':''}"
          onclick="S._sim_semanas=${v};render()">${l}</button>`).join('')}
    </div>
  </div>

  <div class="sim-total">
    <div class="sim-total-label">AHORRO ACUMULADO ILUSTRATIVO</div>
    <div class="sim-total-number">S/${total.toLocaleString('es-PE')}</div>
    <div class="sim-total-copy">
      Guardando S/${aporte} cada semana durante ${semanas} semanas.
    </div>

    <div class="sim-stats">
      <div class="sim-stat">
        <strong>S/${mensual.toLocaleString('es-PE')}</strong>
        <span>aprox. cada 4 semanas</span>
      </div>
      <div class="sim-stat">
        <strong>S/${anual.toLocaleString('es-PE')}</strong>
        <span>si mantienes 52 semanas</span>
      </div>
      <div class="sim-stat">
        <strong>${meses} meses</strong>
        <span>periodo elegido</span>
      </div>
    </div>
  </div>

  <div class="sim-chart-card">
    <div class="sim-section-title">📈 Así crece tu acumulado</div>
    <div class="sim-section-sub">Sin rentabilidad: solo aportes repetidos.</div>
    <div class="sim-chart-wrap">${drawChart(aporte,semanas)}</div>
  </div>

  <div class="sim-insight">
    <strong>💡 La idea no es ahorrar perfecto.</strong>
    <div class="small-muted" style="margin-top:5px">
      Es descubrir qué cantidad podrías convertir en un hábito y qué opciones podría darte con el tiempo.
    </div>
  </div>

  <div class="alert alert-info">
    Este cálculo es ilustrativo. No incluye rentabilidad, inflación, comisiones ni otros factores.
  </div>
  <div class="sim-note">
    FUTURO no predice tu situación financiera. La simulación sirve para visualizar el efecto de repetir una decisión.
  </div>`;
}

function screenCirculo(){
  const personas=[["🧑‍🚀","Marelyn",12,4],["👩‍🚀","Alex",8,3],["🧑‍💻","Dani",15,6],["👨‍🎓","Luis",4,2]];
  return header()+`
  <div class="page-title">👥 MI CÍRCULO</div>
  <div class="page-subtitle">Construyan el hábito juntos. Sin competir por quién tiene más dinero.</div>
  ${personas.map(([av,nom,rac,log])=>`
  <div class="card"><div class="row" style="align-items:center;gap:16px">
    <div style="font-size:38px">${av}</div>
    <div style="flex:1"><strong style="font-size:17px">${nom}</strong>
    <div class="small-muted">🔥 ${rac} días · 🏆 ${log} logros</div></div>
    <span class="badge">EN RACHA</span>
  </div></div>`).join('')}
  <div class="alert alert-ok">En FUTURO no mostramos cuánto dinero tiene cada persona. Compartimos hábitos, rachas y logros.</div>`;
}

function screenPerfil(){
  return header()+`
  <div class="page-title">👤 MI PERFIL</div>
  <div class="page-subtitle">Tu FUTURO empieza conociendo lo que quieres.</div>
  <div class="row" style="align-items:flex-start">
    <div class="card" style="text-align:center;flex:1">
      <div class="avatar">🧑‍🚀</div><h2>Mi Yo</h2><span class="badge">NIVEL ${S.nivel}</span>
    </div>
    <div style="flex:2">
      <label class="small-muted">Edad</label>
      <input id="pEdad" class="field" type="number" min="15" max="70" value="${S.edad}">
      <label class="small-muted">¿Qué quieres poder elegir en tu futuro?</label>
      <input id="pMeta" class="field" value="Tener más libertad financiera">
      <label class="small-muted">¿Cuánto quieres ahorrar semanalmente?</label>
      <input id="pAhorro" class="field" type="number" min="1" value="${S.ahorro_semana}">
      <button class="btn" onclick="guardarPerfil()">💾 GUARDAR MI PERFIL</button>
    </div>
  </div>
  <div class="card"><h3>🏆 Tus logros</h3>
    <span class="badge">🔥 Primera racha</span><span class="badge">💰 Primer ahorro</span>
    <span class="badge">🎯 Primera misión</span><span class="badge badge-orange">🌅 Pensando en 2040</span>
  </div>`;
}
function guardarPerfil(){
  S.edad=document.getElementById('pEdad').value*1;
  S.ahorro_semana=document.getElementById('pAhorro').value*1;
  toast("¡Perfil actualizado!"); render();
}

function render(){
  const screens = {onboarding:screenOnboarding, ahorro:screenAhorro, inicio:screenInicio,
    stories:screenStories, misiones:screenMisiones, ai:screenAI, vida:screenVida,
    simulador:screenSimulador, circulo:screenCirculo, perfil:screenPerfil};
  const fn = screens[S.pantalla]||screenInicio;
  document.getElementById('app').innerHTML = fn() + (S.pantalla==='onboarding'?'':'<div style="height:70px"></div>');
  document.querySelectorAll('.nav').forEach(n=>n.remove());
  if(S.pantalla!=='onboarding' && S.pantalla!=='ahorro') document.body.insertAdjacentHTML('beforeend', nav());
}
render();
</script>
</body>
</html>
