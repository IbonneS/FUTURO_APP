<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FUTURO | Tu vida, tu elección</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
color-scheme:dark;
--fg:#fff;
--pink:#ff2e9a;
--purple:#7c3aff;
--blue:#2e7dff;
--cyan:#00e0ff;
--orange:#ff8a1e;
--lime:#c6ff3d;
--green:#12e28a
}

*{box-sizing:border-box}

html,body{
height:100%;
margin:0
}

body{
font-family:'Inter',sans-serif;
color:var(--fg);
position:relative;
overflow-x:hidden;
background:#070315;
padding-top:env(safe-area-inset-top,0);
padding-bottom:env(safe-area-inset-bottom,0);
min-height:100%;
-webkit-tap-highlight-color:transparent
}

body::before{
content:'';
position:fixed;
inset:0;
z-index:-2;
background:
radial-gradient(circle at 12% 8%,rgba(255,46,154,.30),transparent 32%),
radial-gradient(circle at 88% 15%,rgba(0,224,255,.22),transparent 30%),
radial-gradient(circle at 25% 90%,rgba(124,58,255,.30),transparent 35%),
radial-gradient(circle at 90% 85%,rgba(255,138,30,.20),transparent 30%),
linear-gradient(160deg,#0a0420 0%,#150a30 45%,#06031a 100%);
background-size:180% 180%;
animation:drift 18s ease-in-out infinite
}

body::after{
content:'';
position:fixed;
inset:0;
z-index:-1;
pointer-events:none;
background:
linear-gradient(
to bottom,
rgba(255,255,255,.025),
transparent 22%,
rgba(0,0,0,.16)
)
}

@keyframes drift{
0%,100%{background-position:0% 0%}
50%{background-position:100% 60%}
}

.wrap{
width:min(820px,100%);
margin:0 auto;
padding:30px 22px 125px;
position:relative;
z-index:1
}

button,input,select{
font:inherit
}

button{
font-family:inherit;
cursor:pointer;
-webkit-tap-highlight-color:transparent
}

.btn{
width:100%;
border:none;
border-radius:16px;
padding:15px 20px;
min-height:50px;
font-weight:800;
font-size:15px;
background:
linear-gradient(
135deg,
var(--pink),
var(--purple) 55%,
var(--blue)
);
color:#fff;
transition:.2s;
box-shadow:0 6px 22px rgba(180,40,220,.35)
}

.btn:hover{
transform:translateY(-2px) scale(1.01);
box-shadow:0 10px 30px rgba(255,46,154,.45)
}

.btn:active{
transform:translateY(0) scale(.98)
}

.btn-outline{
background:rgba(255,255,255,.06);
border:1.5px solid rgba(255,255,255,.18);
box-shadow:none
}

.row{
display:flex;
gap:12px
}

.row>*{
flex:1
}

.logo{
font-size:34px;
font-weight:900;
letter-spacing:-1px;
background:
linear-gradient(90deg,#fff,#d9c8ff);
-webkit-background-clip:text;
background-clip:text;
color:transparent
}

.logo span{
background:
linear-gradient(90deg,var(--pink),var(--cyan));
-webkit-background-clip:text;
background-clip:text;
color:transparent
}

.tagline{
color:#b7a6e0;
font-size:13px;
font-weight:600
}

.page-title{
font-size:32px;
font-weight:900;
letter-spacing:-1.5px;
margin:20px 0 4px
}

.page-subtitle{
color:#b6a9d9;
font-size:15px;
margin-bottom:22px
}

.card{
background:
linear-gradient(
160deg,
rgba(35,20,60,.75),
rgba(15,10,30,.85)
);
border:1px solid rgba(255,255,255,.10);
border-radius:22px;
padding:22px;
margin-bottom:16px;
box-shadow:0 12px 35px rgba(0,0,0,.35);
backdrop-filter:blur(6px);
transition:.2s
}

.card:hover{
border-color:rgba(255,255,255,.22);
transform:translateY(-2px)
}

.card:active{
transform:translateY(0)
}

.card-blue{
background:
radial-gradient(
circle at top right,
rgba(0,224,255,.28),
transparent 50%
),
linear-gradient(
160deg,
rgba(20,30,70,.85),
rgba(10,12,35,.9)
)
}

.card-orange{
background:
radial-gradient(
circle at top right,
rgba(255,138,30,.28),
transparent 50%
),
linear-gradient(
160deg,
rgba(60,30,15,.85),
rgba(25,12,10,.9)
)
}

.card-purple{
background:
radial-gradient(
circle at top right,
rgba(255,46,154,.26),
transparent 50%
),
linear-gradient(
160deg,
rgba(50,15,60,.85),
rgba(20,8,30,.9)
)
}

.metric{
font-size:27px;
font-weight:900;
background:
linear-gradient(90deg,#fff,#e6d8ff);
-webkit-background-clip:text;
background-clip:text;
color:transparent
}

.metric-label{
color:#b6a9d9;
font-size:12px;
font-weight:700;
letter-spacing:.5px
}

.big-number{
font-size:44px;
font-weight:900;
background:
linear-gradient(90deg,var(--cyan),var(--lime));
-webkit-background-clip:text;
background-clip:text;
color:transparent
}

.small-muted{
color:#a99cc9;
font-size:13px
}

.hero{
border-radius:28px;
padding:34px 26px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,.14);
position:relative;
overflow:hidden;
background:
radial-gradient(
circle at 85% 10%,
rgba(0,224,255,.30),
transparent 40%
),
radial-gradient(
circle at 10% 100%,
rgba(255,46,154,.25),
transparent 40%
),
linear-gradient(
135deg,
#1a0c3d,
#0a0620
);
box-shadow:0 15px 45px rgba(90,20,140,.25)
}

.hero-kicker{
color:var(--cyan);
font-size:12px;
font-weight:900;
text-transform:uppercase;
letter-spacing:2.5px
}

.hero-title{
font-size:39px;
line-height:1.08;
font-weight:900;
margin:10px 0
}

.hero-title span{
background:
linear-gradient(
90deg,
var(--pink),
var(--orange)
);
-webkit-background-clip:text;
background-clip:text;
color:transparent
}

.hero-text{
color:#c3b6e6;
font-size:15px;
line-height:1.65
}

.avatar{
width:112px;
height:112px;
border-radius:50%;
background:
linear-gradient(
145deg,
var(--pink),
var(--purple) 60%,
var(--blue)
);
display:flex;
align-items:center;
justify-content:center;
font-size:58px;
margin:0 auto 10px;
border:3px solid rgba(255,255,255,.35);
box-shadow:0 0 50px rgba(255,46,154,.35)
}

.progress-container{
background:rgba(255,255,255,.08);
height:11px;
border-radius:20px;
overflow:hidden;
margin:12px 0
}

.progress-bar{
height:100%;
border-radius:20px;
background:
linear-gradient(
90deg,
var(--pink),
var(--cyan)
)
}

.story{
min-height:440px;
border-radius:26px;
padding:30px;
display:flex;
flex-direction:column;
justify-content:space-between;
border:1px solid rgba(255,255,255,.12);
background:
radial-gradient(
circle at 80% 15%,
rgba(255,138,30,.35),
transparent 35%
),
linear-gradient(
150deg,
#2a1050,
#0c0620
)
}

.story-label{
color:var(--orange);
font-size:12px;
font-weight:900;
letter-spacing:2px
}

.story-question{
font-size:29px;
font-weight:900;
line-height:1.2;
margin-top:14px
}

.badge{
display:inline-block;
background:rgba(0,224,255,.15);
color:#7be9ff;
padding:6px 12px;
border-radius:50px;
font-size:12px;
font-weight:800;
margin:3px 4px 3px 0;
border:1px solid rgba(0,224,255,.25)
}

.badge-orange{
background:rgba(255,138,30,.15);
color:#ffb266;
border-color:rgba(255,138,30,.3)
}

.chat-user{
background:
linear-gradient(
135deg,
var(--purple),
var(--blue)
);
border-radius:18px 18px 4px 18px;
padding:13px 16px;
margin:10px 0 10px 18%;
font-weight:600
}

.chat-ai{
background:rgba(255,255,255,.06);
border-radius:18px 18px 18px 4px;
padding:13px 16px;
margin:10px 18% 10px 0;
border:1px solid rgba(255,255,255,.1)
}

.field{
width:100%;
padding:12px 14px;
border-radius:12px;
border:1.5px solid rgba(255,255,255,.15);
background:rgba(20,10,40,.6);
color:#fff;
font-size:14px;
margin:6px 0 14px
}

.field:focus{
outline:none;
border-color:var(--pink)
}

.toast{
position:fixed;
left:50%;
bottom:90px;
transform:translateX(-50%);
background:
linear-gradient(
135deg,
var(--green),
#0aa869
);
color:#03130a;
padding:12px 22px;
border-radius:14px;
font-weight:800;
font-size:14px;
box-shadow:0 10px 30px rgba(20,220,140,.4);
opacity:0;
pointer-events:none;
transition:.3s;
z-index:50;
text-align:center;
max-width:90%
}

.toast.show{
opacity:1;
bottom:100px
}

.alert{
border-radius:14px;
padding:13px 16px;
font-size:13px;
margin:14px 0;
border:1px solid
}

.alert-warn{
background:rgba(255,180,30,.12);
color:#ffd27a;
border-color:rgba(255,180,30,.3)
}

.alert-info{
background:rgba(0,224,255,.10);
color:#8ee9ff;
border-color:rgba(0,224,255,.3)
}

.alert-ok{
background:rgba(18,226,138,.12);
color:#7cf0bb;
border-color:rgba(18,226,138,.3)
}

/* =========================================================
   NAVEGACIÓN
========================================================= */

.nav{
position:fixed;
left:50%;
bottom:max(10px,env(safe-area-inset-bottom));
transform:translateX(-50%);
width:min(760px,calc(100% - 20px));
padding:8px;
display:grid;
grid-template-columns:repeat(8,minmax(0,1fr));
gap:7px;
background:rgba(7,3,20,.90);
border:1px solid rgba(255,255,255,.13);
border-radius:22px;
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
box-shadow:
0 18px 55px rgba(0,0,0,.52),
0 0 40px rgba(124,58,255,.10);
z-index:40
}

.nav button{
position:relative;
min-width:0;
min-height:64px;
padding:7px 3px;
border-radius:15px;
background:rgba(255,255,255,.035);
border:1px solid rgba(255,255,255,.065);
color:#9185ad;
font-size:24px;
overflow:hidden
}

.nav button::before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
135deg,
rgba(255,255,255,.06),
transparent 60%
);
opacity:0;
transition:.2s
}

.nav button:hover::before,
.nav button.active::before{
opacity:1
}

.nav button:hover{
color:#fff;
transform:translateY(-2px);
border-color:rgba(255,255,255,.18);
background:rgba(255,255,255,.075)
}

.nav button.active{
color:#fff;
background:
linear-gradient(
135deg,
rgba(255,46,154,.28),
rgba(124,58,255,.28),
rgba(0,224,255,.16)
);
border-color:rgba(255,255,255,.22);
box-shadow:
0 6px 18px rgba(124,58,255,.18),
inset 0 0 18px rgba(255,255,255,.035)
}

.nav span{
position:relative;
z-index:1;
font-size:9px;
font-weight:800
}

select.field{
appearance:none
}

h2,h3{
margin:10px 0 6px
}

/* =========================================================
   PRESENTACIÓN PC
========================================================= */

@media(min-width:901px){

.wrap{
padding-top:38px
}

.hero{
padding:40px 30px
}

.card{
padding:24px
}

.page-title{
font-size:34px
}

body{
background:#03020b
}

body::before{
opacity:.78
}

#app{
width:min(820px,calc(100vw - 40px));
margin:18px auto 0;
min-height:calc(100vh - 160px);
border:1px solid rgba(255,255,255,.07);
border-radius:32px;
background:
linear-gradient(
180deg,
rgba(16,8,35,.30),
rgba(7,3,20,.16)
);
box-shadow:0 30px 90px rgba(0,0,0,.30);
overflow:hidden
}

}

/* =========================================================
   V2
========================================================= */

:root{
--app-bg:#070315;
--glass:rgba(20,12,42,.72);
--glass-strong:rgba(15,8,32,.90);
--line:rgba(255,255,255,.11);
--line-soft:rgba(255,255,255,.07);
--muted:#a99dcc;
--shadow:0 18px 55px rgba(0,0,0,.34)
}

.logo{
font-size:32px;
letter-spacing:-1.5px;
text-shadow:0 0 30px rgba(255,46,154,.18)
}

.tagline{
margin-top:2px;
letter-spacing:.2px
}

.hero{
position:relative;
isolation:isolate;
overflow:hidden
}

.hero::after{
content:"";
position:absolute;
width:180px;
height:180px;
right:-70px;
bottom:-85px;
border-radius:50%;
background:rgba(124,58,255,.22);
filter:blur(20px);
z-index:-1
}

.hero-kicker{
display:inline-flex;
align-items:center;
padding:7px 10px;
border-radius:999px;
background:rgba(0,224,255,.08);
border:1px solid rgba(0,224,255,.16)
}

.hero-text{
max-width:620px
}

.card{
box-shadow:var(--shadow)
}

.btn{
min-height:52px;
letter-spacing:.15px
}

.btn-outline{
background:rgba(255,255,255,.045)
}

.btn-outline:hover{
background:rgba(255,255,255,.09);
border-color:rgba(255,255,255,.25)
}

.field{
min-height:48px;
border-radius:14px;
background:rgba(8,4,22,.62)
}

.field::placeholder{
color:#74688e
}

.badge{
padding:7px 11px;
box-shadow:inset 0 0 16px rgba(0,224,255,.035)
}

.progress-container{
height:10px;
background:rgba(255,255,255,.065);
box-shadow:inset 0 1px 3px rgba(0,0,0,.25)
}

.progress-bar{
box-shadow:0 0 16px rgba(0,224,255,.28)
}

.story{
position:relative;
overflow:hidden;
box-shadow:var(--shadow)
}

.story::after{
content:"";
position:absolute;
width:150px;
height:150px;
right:-55px;
top:-55px;
border-radius:50%;
background:rgba(255,138,30,.18);
filter:blur(10px);
pointer-events:none
}

/* =========================================================
   SIMULADOR V3
========================================================= */

.sim-hero{
position:relative;
overflow:hidden;
padding:22px;
border-radius:24px;
background:
radial-gradient(circle at 88% 12%,rgba(0,224,255,.18),transparent 34%),
radial-gradient(circle at 12% 90%,rgba(124,58,255,.20),transparent 38%),
linear-gradient(145deg,rgba(29,14,60,.88),rgba(9,5,25,.82));
border:1px solid rgba(255,255,255,.12);
box-shadow:0 18px 50px rgba(0,0,0,.30)
}

.sim-hero .sim-icon{
width:52px;
height:52px;
display:grid;
place-items:center;
border-radius:16px;
background:rgba(0,224,255,.10);
border:1px solid rgba(0,224,255,.18);
font-size:27px;
margin-bottom:14px
}

.sim-kicker{
color:#78eaff;
font-size:10px;
font-weight:900;
letter-spacing:1.8px
}

.sim-title{
margin-top:5px;
font-size:29px;
line-height:1.08;
font-weight:950;
letter-spacing:-1px
}

.sim-title span{
background:
linear-gradient(
90deg,
#fff,
#7eefff,
#b894ff
);
-webkit-background-clip:text;
background-clip:text;
color:transparent
}

.sim-sub{
margin-top:9px;
color:#aaa0c4;
font-size:13px;
line-height:1.55
}

.sim-input-card{
margin-top:14px;
padding:18px;
border-radius:20px;
background:rgba(13,7,30,.78);
border:1px solid rgba(255,255,255,.09)
}

.sim-label-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:9px
}

.sim-label{
font-size:12px;
font-weight:850;
color:#c9c0dc
}

.sim-value{
color:#fff;
font-size:20px;
font-weight:950
}

.sim-range{
width:100%;
accent-color:#7c3aff;
cursor:pointer
}

.sim-presets{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
margin-top:11px
}

.sim-preset{
min-height:40px;
border-radius:12px;
border:1px solid rgba(255,255,255,.09);
background:rgba(255,255,255,.045);
color:#bdb2d2;
font-weight:800;
font-size:11px
}

.sim-preset:hover,
.sim-preset.active{
color:#fff;
border-color:rgba(124,58,255,.55);
background:rgba(124,58,255,.16)
}

.sim-total{
margin-top:14px;
padding:21px;
border-radius:23px;
background:
linear-gradient(
135deg,
rgba(0,224,255,.13),
rgba(124,58,255,.18)
),
rgba(13,7,30,.82);
border:1px solid rgba(120,235,255,.17);
box-shadow:0 18px 50px rgba(0,0,0,.25)
}

.sim-total-label{
color:#8eeaff;
font-size:10px;
font-weight:900;
letter-spacing:1.5px
}

.sim-total-number{
margin-top:5px;
font-size:42px;
line-height:1;
font-weight:950;
letter-spacing:-1.5px
}

.sim-total-copy{
margin-top:8px;
color:#aaa0c4;
font-size:12px
}

.sim-stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:12px
}

.sim-stat{
padding:13px 9px;
border-radius:16px;
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.065)
}

.sim-stat strong{
display:block;
font-size:16px;
color:#fff
}

.sim-stat span{
display:block;
margin-top:3px;
color:#8f84a9;
font-size:9px;
line-height:1.25
}

.sim-chart-card{
margin-top:12px;
padding:17px;
border-radius:20px;
background:rgba(13,7,30,.72);
border:1px solid rgba(255,255,255,.08)
}

.sim-section-title{
font-size:13px;
font-weight:900;
color:#eee8f7
}

.sim-section-sub{
margin-top:3px;
color:#817696;
font-size:10px
}

.sim-chart-wrap{
margin-top:9px;
margin-left:-7px;
margin-right:-7px
}

.sim-insight{
margin-top:12px;
padding:15px;
border-radius:17px;
background:rgba(255,138,30,.075);
border:1px solid rgba(255,138,30,.18)
}

.sim-insight strong{
color:#ffc078
}

.sim-note{
margin-top:12px;
font-size:10px;
line-height:1.5;
color:#817696
}

/* =========================================================
   NUEVO — CAMINO FINANCIERO
========================================================= */

.path-card{
position:relative;
overflow:hidden;
padding:18px;
border-radius:20px;
margin-bottom:11px;
background:
linear-gradient(
145deg,
rgba(25,13,53,.86),
rgba(10,6,25,.90)
);
border:1px solid rgba(255,255,255,.08);
transition:.2s
}

.path-card:hover{
transform:translateY(-2px);
border-color:rgba(255,255,255,.20)
}

.path-card.locked{
opacity:.55
}

.path-card.done{
border-color:rgba(18,226,138,.28);
background:
linear-gradient(
145deg,
rgba(10,50,43,.60),
rgba(10,8,28,.90)
)
}

.path-number{
width:42px;
height:42px;
display:grid;
place-items:center;
border-radius:14px;
font-size:20px;
background:
linear-gradient(
135deg,
rgba(255,46,154,.18),
rgba(124,58,255,.22)
);
border:1px solid rgba(255,255,255,.10)
}

.path-line{
position:absolute;
left:38px;
top:60px;
bottom:-15px;
width:2px;
background:
linear-gradient(
180deg,
rgba(124,58,255,.55),
rgba(0,224,255,.05)
)
}

.path-last .path-line{
display:none
}

.choice-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin-top:14px
}

.choice-btn{
min-height:70px;
padding:12px;
border-radius:16px;
border:1px solid rgba(255,255,255,.10);
background:rgba(255,255,255,.045);
color:#fff;
font-weight:800;
text-align:left;
transition:.2s
}

.choice-btn:hover{
transform:translateY(-2px);
border-color:rgba(255,255,255,.22);
background:rgba(255,255,255,.09)
}

.choice-btn.pink:hover{
border-color:rgba(255,46,154,.5);
background:rgba(255,46,154,.10)
}

.choice-btn.cyan:hover{
border-color:rgba(0,224,255,.5);
background:rgba(0,224,255,.08)
}

.choice-btn.orange:hover{
border-color:rgba(255,138,30,.5);
background:rgba(255,138,30,.08)
}

.choice-btn.green:hover{
border-color:rgba(18,226,138,.5);
background:rgba(18,226,138,.08)
}

/* =========================================================
   NUEVO — MARIPOSA

.butterfly{

t.textContent=msg;

t.classList.add('show');

setTimeout(

2600
);

}

function escapar(txt){

return String(txt)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function completarAccion(xp=100,ahorro=0){

S.xp-=500;

S.logros+=1;

toast("⭐ ¡Subiste de nivel!");

}

}

function respuestaAI(v){

const t=v.toLowerCase();


if(
t.includes("mora") ||
t.includes("atras") ||
t.includes("cuota") ||
t.includes("pago")
){

return `
⚠️ Primero identifica qué obligación tienes y revisa la fecha, monto y condiciones aplicables.

Si ya existe un atraso, conviene revisar la situación y contactar a la entidad para conocer las alternativas disponibles.

<br><br>

<strong>Idea FUTURO:</strong>

una deuda no desaparece por ignorarla. Organizarla temprano permite entender mejor tus opciones.
`;

}


if(
t.includes("tarjeta") ||
t.includes("credito") ||
t.includes("crédito")
){

return `
💳 Antes de usar crédito, revisa cuánto pagarás realmente, la cuota, el plazo, los costos y la fecha de pago.

<br><br>

Una cuota que parece pequeña puede extenderse durante muchos meses.

<strong>Pregunta clave:</strong>

¿Puedo asumir esta obligación incluso si mis ingresos cambian?
`;

}


if(
t.includes("ahorro") ||
t.includes("guardar")
){

return `
🌱 Podemos empezar por convertir tu intención en una acción concreta.

Por ejemplo:

<br><br>

<strong>
¿Cuánto puedes separar de forma sostenible?
</strong>

<br><br>

Después podemos convertirlo en una meta semanal y observar qué ocurre con el tiempo.

No necesitas empezar perfecto. Necesitas empezar de forma realista.
`;

}


if(
t.includes("estafa") ||
t.includes("fraude") ||
t.includes("mensaje") ||
t.includes("link") ||
t.includes("enlace")
){

return `
🛡️ Si un mensaje te pide claves, códigos o información sensible con urgencia, detente.

<br><br>

No ingreses los datos desde el enlace recibido.

Verifica la información utilizando un canal oficial de la entidad.

<br><br>

<strong>
Regla FUTURO: pausa → verifica → decide.
</strong>
`;

}


if(
t.includes("invert") ||
t.includes("inversión") ||
t.includes("inversion")
){

return `
📈 Antes de invertir, entiende qué estás comprando, qué riesgos existen, cuánto tiempo piensas mantenerlo y qué costos pueden existir.

<br><br>

Una rentabilidad prometida no significa que el resultado esté garantizado.

<strong>
Primero entiende. Después decide.
</strong>
`;

}


if(
t.includes("presupuesto") ||
t.includes("gasto")
){

return `
📊 Empieza separando tres cosas:

<br>

1. Gastos necesarios.
<br>
2. Gastos que puedes ajustar.
<br>
3. Metas o ahorro.

<br>

Así puedes observar dónde tienes margen sin convertir el presupuesto en un castigo.
`;

}


return `
💡 Pensemos juntos.

No existe una respuesta financiera universal.

Primero podemos identificar:

<br><br>

<strong>
1.</strong> Qué quieres lograr.

<br>

<strong>
2.</strong> Qué recursos tienes.

<br>

<strong>
3.</strong> Qué obligación asumirías.

<br>

<strong>
4.</strong> Qué riesgos existen.

<br><br>

Después puedes comparar tus alternativas.
`;

}

}

function drawChart(aporte,semanas){

const w=680;

const h=220;

const pad=30;

const total=aporte*semanas;

const pts=[];

const N=Math.min(semanas,60);

for(let i=0;i<=N;i++){

const s=Math.round(
i*semanas/N
);

const x=
pad+
(w-2*pad)*
(s/semanas);

const y=
h-pad-
(h-2*pad)*
(
s*aporte/total||0
);

pts.push(`${x},${y}`);

}

return `

<svg
viewBox="0 0 ${w} ${h}"
style="width:100%;height:220px"
>

<polyline
points="${pts.join(' ')} ${w-pad},${h-pad} ${pad},${h-pad}"
fill="rgba(23,119,255,.25)"
stroke="none"
/>

<polyline
points="${pts.join(' ')}"
fill="none"
stroke="#5ca8ff"
stroke-width="3"
/>

</svg>

`;

}
